<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1480" viewBox="0 0 1920 1480" role="img" aria-labelledby="title description">
  <title id="title">خارطة تدفق مشروع NEXORA</title>
  <desc id="description">مخطط معماري يوضح انتقال الطلب من المتصفح إلى توجيه PHP، ثم صفحات المتجر والإدارة، وحدات التحكم والنماذج وقاعدة بيانات MySQL، مع تكاملات Google وGemini وOpenStreetMap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090716"/><stop offset=".55" stop-color="#0b0a1b"/><stop offset="1" stop-color="#10102a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#875cff"/><stop offset="1" stop-color="#20c8e9"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17132d"/><stop offset="1" stop-color="#100e22"/></linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171532"/><stop offset="1" stop-color="#10152a"/></linearGradient>
    <linearGradient id="admin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17132f"/><stop offset="1" stop-color="#171022"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="b"/><feColorMatrix in="b" type="matrix" values="0 0 0 0 .25  0 0 0 0 .18  0 0 0 0 .8  0 0 0 .24 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42d9ed"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c78ff"/></marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8276cc" stroke-opacity=".055" stroke-width="1"/></pattern>
    <style>
      text{font-family:Cairo,"Segoe UI",Arial,sans-serif;fill:#eeeaff}
      .title{font-size:42px;font-weight:800;letter-spacing:.2px}
      .subtitle{font-size:18px;fill:#aaa4cf}
      .kicker{font-size:13px;font-weight:700;letter-spacing:3px;fill:#36d8ed}
      .section{font-size:22px;font-weight:800}
      .node-title{font-size:17px;font-weight:750}
      .body{font-size:14px;fill:#c0badb}
      .small{font-size:12px;fill:#9791b8}
      .tiny{font-size:11px;fill:#8e89ad}
      .code{font-family:Consolas,"Courier New",monospace;font-size:12px;fill:#80e5f1}
      .card{fill:#17142b;stroke:#39305f;stroke-width:1.4}
      .node{fill:#141229;stroke:#40366a;stroke-width:1.3}
      .store-card{fill:#12172a;stroke:#30445e;stroke-width:1.1}
      .admin-card{fill:#191326;stroke:#503c67;stroke-width:1.1}
      .line{fill:none;stroke:#42d9ed;stroke-width:2.2;marker-end:url(#arrowCyan)}
      .line-purple{fill:none;stroke:#9c78ff;stroke-width:2.2;marker-end:url(#arrowPurple)}
      .dash{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:7 7;marker-end:url(#arrowPurple);opacity:.9}
    </style>
  </defs>

